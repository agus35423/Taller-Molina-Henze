{% extends 'tallermami/base.html' %}

                <div class="auth-icon">

                <h1>

                <p>

                </p>

                <div class="auth-footer">

                    <a href="{% url 'login' %}">
                        Volver a iniciar sesión
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</section>
