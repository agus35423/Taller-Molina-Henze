
{% extends "tallermami/base.html" %}

{% block title %}Panel del Secretario{% endblock %}

{% block content %}
<div class="container py-4">
    <h1>Panel del Secretario</h1>
    <p class="text-muted">Seleccioná la sección que querés consultar.</p>

    <div class="row g-4 mt-2">
        <div class="col-md-6">
            <a href="{% url 'secretario_clientes' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5">Clientes</h2>
                        <p class="text-muted mb-0">Consultar clientes registrados.</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6">
            <a href="{% url 'secretario_turnos' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5">Turnos</h2>
                        <p class="text-muted mb-0">Buscar turnos y exportarlos a Excel.</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
